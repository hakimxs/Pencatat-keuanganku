<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kantong</title>
<meta name="description" content="Pencatat keuangan, hutang, dan piutang.">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{color-scheme:light}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>

/* Layout: satu kolom sempit ala aplikasi seluler. Header lengket, navigasi bawah, tombol + melayang, form muncul sebagai lembar dari bawah. Antarmuka monokrom; warna hanya dipakai untuk uang masuk, keluar, dan tenggat. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --fg:#13161B; --mut:#6B7280; --line:#E6E8EC; --soft:#EEF0F3;
  --ink:#13161B; --onink:#FFFFFF;
  --in:#0E7A4F; --inbg:#E6F4EE; --out:#C2410C; --outbg:#FCEBE2; --warn:#B42318; --warnbg:#FDECEA;
  --scrim:rgba(10,12,16,.45);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1013; --surface:#16191E; --fg:#EEF0F3; --mut:#939AA6; --line:#262A31; --soft:#1E2228;
    --ink:#EEF0F3; --onink:#0E1013;
    --in:#4ADE9B; --inbg:#12281F; --out:#FB9A6C; --outbg:#33200F; --warn:#FF8A80; --warnbg:#3A1C1A;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#16191E; --fg:#EEF0F3; --mut:#939AA6; --line:#262A31; --soft:#1E2228;
  --ink:#EEF0F3; --onink:#0E1013;
  --in:#4ADE9B; --inbg:#12281F; --out:#FB9A6C; --outbg:#33200F; --warn:#FF8A80; --warnbg:#3A1C1A;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 150px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.lock{overflow:hidden}
.wrap{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
header.top h1{font-family:var(--display);font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mut)}
.icon-btn:active{background:var(--soft)}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
.monthbar .lbl{font-weight:600;text-transform:capitalize}
.monthbar button{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.monthbar button[disabled]{opacity:.35;cursor:default}

.hero{padding:6px 0 18px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:500}
.hero .big{font-size:38px;font-weight:700;line-height:1.1;margin-top:4px;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.tile .v{font-size:19px;font-weight:600;margin-top:4px;overflow-wrap:anywhere}
.in{color:var(--in)} .out{color:var(--out)} .mut{color:var(--mut)}
section.blk{margin-top:26px}
section.blk>h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:500;margin:0 0 10px}
.panel-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}

.chart{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}
.chart .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.chart .b{width:35%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px}
.chart .b.i{background:var(--in)} .chart .b.o{background:var(--out)}
.chart .m{font-size:11px;color:var(--mut);text-transform:capitalize}
.legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

.cat{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.cat .track{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.cat .track i{display:block;height:100%;background:var(--ink);border-radius:3px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day{font-size:12px;color:var(--mut);font-weight:500;margin:18px 0 8px;text-transform:none}
.row-item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-top:1px solid var(--line);min-width:0}
.list>.row-item:first-child{border-top:0}
.row-item:active{background:var(--soft)}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico.in{background:var(--inbg)} .ico.out{background:var(--outbg)}
.row-item .t{flex:1;min-width:0}
.row-item .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item .t small{color:var(--mut);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item .a{font-weight:600;font-size:15px;white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}

.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 8px;border-radius:9px;font-weight:500;color:var(--mut);font-size:14px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.debtsum{margin:16px 0 14px}
.debtsum .big{font-size:32px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.dcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.dcard .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dcard .h b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dcard .note{color:var(--mut);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:6px;border-radius:3px;background:var(--soft);margin:12px 0 8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:3px}
.dcard .f{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut);align-items:center}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.ok{background:var(--inbg);color:var(--in)}

nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px)}
nav.bar .in-nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.bar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:11.5px;color:var(--mut);font-weight:500;border-radius:12px}
nav.bar button.on{color:var(--fg)}
.fab{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));
  height:52px;padding:0 20px 0 16px;border-radius:26px;background:var(--ink);color:var(--onink);display:flex;align-items:center;gap:8px;font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.22)}
.fab:active{transform:scale(.97)}

#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim)}
#sheet .panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:10px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .panel{animation:none}.fab:active{transform:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.panel h2{font-family:var(--display);font-size:20px;margin:0 0 14px;letter-spacing:-.01em}
.panel label{display:block;font-size:12.5px;color:var(--mut);margin:14px 0 6px;font-weight:500}
.panel input:not([type=radio]),.panel select,.panel textarea{width:100%;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:12px 14px;min-height:46px}
.panel input:focus,.panel select:focus,.panel textarea:focus{outline:none;border-color:var(--fg)}
.panel textarea{min-height:90px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.amt{position:relative}
.amt span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-weight:500}
.amt input{padding-left:44px!important;font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;min-height:48px;border-radius:14px;background:var(--ink);color:var(--onink);font-weight:600}
.btn.ghost{background:var(--soft);color:var(--fg)}
.btn.danger{background:var(--warnbg);color:var(--warn)}
.err{margin-top:12px;color:var(--warn);font-size:13.5px}
.hint{font-size:13px;color:var(--mut);margin-top:10px}
.pay{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.pay:first-child{border-top:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:14px;padding:10px 12px 10px 14px;font-size:13px;margin-bottom:16px;color:var(--mut)}
.banner button{font-weight:600;color:var(--fg);padding:6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--onink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%}

#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lk{width:100%;max-width:340px;text-align:center}
.lk .brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;margin-bottom:26px}
.lk h2{font-family:var(--display);font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
.lk .sub{color:var(--mut);font-size:14px;min-height:20px}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0 8px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--mut)}
.dots i.on{background:var(--fg);border-color:var(--fg)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.dots.shake{animation:none}}
.lk-msg{min-height:22px;color:var(--warn);font-size:13.5px;margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-size:24px;font-weight:600}
.pad button:active{background:var(--soft)}
.pad .fn{background:none;border-color:transparent;font-size:14px;color:var(--mut);font-family:var(--font);font-weight:500}
.lk-links{margin-top:16px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.lk-links button{color:var(--mut);font-size:14px;padding:8px}
body.locked .wrap,body.locked .fab,body.locked nav.bar{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Kantong</h1>
    <button class="icon-btn" data-act="data" aria-label="Data dan cadangan">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="app"></main>
</div>

<button class="fab" id="fab" data-act="add"></button>
<nav class="bar"><div class="in-nav" id="nav"></div></nav>
<div id="lock" hidden></div>
<div id="sheet" hidden></div>

<script>
(function(){
var KEY='kantong-v1';
var $=function(s,r){return (r||document).querySelector(s)};
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return iso(d)}
function addMonths(k,n){var p=k.split('-');var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rp(n){return 'Rp '+Math.round(n).toLocaleString('id-ID')}
function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
function fmtDay(s){return parseD(s).toLocaleDateString('id-ID',{day:'numeric',month:'short'})}
function fmtFull(s){return parseD(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function monthLabel(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}
function monthShort(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('id-ID',{month:'short'})}

var CATS={out:['Makan','Transport','Belanja','Tagihan','Hiburan','Kesehatan','Lainnya'],in:['Gaji','Usaha','Bonus','Lainnya']};

function seed(){
  var t=today(), cur=t.slice(0,7), tx=[], i, k;
  var rows=[
    [1,'in','Gaji','Gaji bulanan',[6500000,6500000,6500000,6500000,6500000]],
    [2,'out','Tagihan','Listrik dan internet',[620000,640000,610000,655000,630000]],
    [4,'out','Makan','Belanja dapur',[350000,410000,380000,395000,365000]],
    [8,'out','Transport','Bensin',[150000,170000,140000,160000,155000]],
    [12,'out','Hiburan','Nonton dan jajan',[120000,200000,90000,150000,110000]],
    [15,'out','Belanja','Kebutuhan rumah',[260000,180000,310000,220000,240000]],
    [20,'out','Makan','Makan di luar',[210000,190000,230000,200000,220000]],
    [25,'in','Usaha','Jual barang bekas',[0,300000,0,450000,250000]]
  ];
  for(k=0;k<5;k++){
    var mk=addMonths(cur,-k);
    for(i=0;i<rows.length;i++){
      var r=rows[i], a=r[4][k], d=mk+'-'+pad(r[0]);
      if(!a||d>t)continue;
      tx.push({id:uid(),type:r[1],amt:a,cat:r[2],note:r[3],date:d,ex:1});
    }
  }
  var debts=[
    {id:uid(),kind:'piutang',who:'Rudi',amt:1500000,note:'Pinjam untuk servis motor',date:addDays(t,-20),due:addDays(t,10),pays:[{id:uid(),amt:500000,date:addDays(t,-9)}],ex:1},
    {id:uid(),kind:'piutang',who:'Sari',amt:300000,note:'Patungan tiket',date:addDays(t,-30),due:addDays(t,-3),pays:[],ex:1},
    {id:uid(),kind:'hutang',who:'Andi',amt:2000000,note:'Patungan sewa',date:addDays(t,-12),due:addDays(t,25),pays:[],ex:1},
    {id:uid(),kind:'hutang',who:'Koperasi kantor',amt:1200000,note:'Cicilan kasbon',date:addDays(t,-40),due:addDays(t,5),pays:[{id:uid(),amt:400000,date:addDays(t,-15)}],ex:1}
  ];
  return {tx:tx,debts:debts};
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.tx&&o.debts)return o}}catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load();
var tab='home', month=today().slice(0,7), dk='piutang';

function paid(d){return sum(d.pays,function(p){return p.amt})}
function sisa(d){return Math.max(0,d.amt-paid(d))}
function hasEx(){return S.tx.some(function(x){return x.ex})||S.debts.some(function(x){return x.ex})}

var IC={
  home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  tx:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  debt:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg>',
  up:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>',
  down:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17M16 17H7V8"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

function monthBar(){
  var isCur=month>=today().slice(0,7);
  return '<div class="monthbar"><button data-act="mprev" aria-label="Bulan sebelumnya">'+IC.prev+'</button><span class="lbl">'+monthLabel(month)+'</span><button data-act="mnext" aria-label="Bulan berikutnya"'+(isCur?' disabled':'')+'>'+IC.next+'</button></div>';
}
function banner(){
  return hasEx()?'<div class="banner"><span>Ini data contoh. Hapus kapan saja.</span><button data-act="clearex">Hapus contoh</button></div>':'';
}
function txRow(t){
  var isIn=t.type==='in';
  return '<button class="row-item" data-act="edittx" data-id="'+t.id+'"><span class="ico '+(isIn?'in':'out')+'">'+(isIn?IC.down:IC.up)+'</span>'+
    '<span class="t"><b>'+esc(t.note||t.cat)+'</b><small>'+esc(t.cat)+' · '+fmtDay(t.date)+'</small></span>'+
    '<span class="a num '+(isIn?'in':'out')+'">'+(isIn?'+':'−')+rp(t.amt).replace('Rp ','')+'</span></button>';
}

function vHome(){
  var tx=S.tx.filter(function(t){return t.date.slice(0,7)===month});
  var inn=sum(tx.filter(function(t){return t.type==='in'}),function(t){return t.amt});
  var out=sum(tx.filter(function(t){return t.type==='out'}),function(t){return t.amt});
  var bal=sum(S.tx,function(t){return t.type==='in'?t.amt:-t.amt});
  var piu=sum(S.debts.filter(function(d){return d.kind==='piutang'}),sisa);
  var hut=sum(S.debts.filter(function(d){return d.kind==='hutang'}),sisa);
  var h=banner();
  h+='<div class="hero"><div class="eyebrow">Saldo</div><div class="big num">'+(bal<0?'−':'')+rp(Math.abs(bal))+'</div></div>';
  h+=monthBar();
  h+='<div class="tiles"><div class="tile"><div class="eyebrow">Masuk</div><div class="v num in">'+rp(inn)+'</div></div><div class="tile"><div class="eyebrow">Keluar</div><div class="v num out">'+rp(out)+'</div></div></div>';
  h+='<div class="tiles"><div class="tile"><div class="eyebrow">Piutang</div><div class="v num">'+rp(piu)+'</div></div><div class="tile"><div class="eyebrow">Hutang</div><div class="v num">'+rp(hut)+'</div></div></div>';

  var cols='',mx=1,ms=[],i;
  for(i=5;i>=0;i--){
    var k=addMonths(month,-i), mt=S.tx.filter(function(t){return t.date.slice(0,7)===k});
    var a=sum(mt.filter(function(t){return t.type==='in'}),function(t){return t.amt});
    var b=sum(mt.filter(function(t){return t.type==='out'}),function(t){return t.amt});
    ms.push({k:k,a:a,b:b});mx=Math.max(mx,a,b);
  }
  ms.forEach(function(m){
    cols+='<div class="col"><div class="bars"><div class="b i" style="height:'+(m.a/mx*100)+'%" title="Masuk '+rp(m.a)+'"></div><div class="b o" style="height:'+(m.b/mx*100)+'%" title="Keluar '+rp(m.b)+'"></div></div><span class="m">'+monthShort(m.k)+'</span></div>';
  });
  h+='<section class="blk"><h2>6 bulan terakhir</h2><div class="panel-card"><div class="chart">'+cols+'</div><div class="legend"><span><i style="background:var(--in)"></i>Masuk</span><span><i style="background:var(--out)"></i>Keluar</span></div></div></section>';

  var by={};tx.filter(function(t){return t.type==='out'}).forEach(function(t){by[t.cat]=(by[t.cat]||0)+t.amt});
  var cats=Object.keys(by).sort(function(a,b){return by[b]-by[a]}).slice(0,5);
  h+='<section class="blk"><h2>Pengeluaran per kategori</h2>';
  if(!cats.length){h+='<div class="empty">Belum ada pengeluaran di bulan ini.</div>'}
  else{h+='<div class="panel-card">'+cats.map(function(c){return '<div class="cat"><span>'+esc(c)+'</span><span class="track"><i style="width:'+(by[c]/out*100)+'%"></i></span><span class="num">'+rp(by[c])+'</span></div>'}).join('')+'</div>'}
  h+='</section>';

  var last=S.tx.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0}).slice(0,5);
  h+='<section class="blk"><h2>Terbaru</h2>';
  h+=last.length?'<div class="list">'+last.map(txRow).join('')+'</div>':'<div class="empty">Belum ada transaksi. Ketuk tombol Catat untuk memulai.</div>';
  h+='</section>';
  return h;
}

function dayLabel(s){
  var t=today();
  if(s===t)return 'Hari ini';
  if(s===addDays(t,-1))return 'Kemarin';
  return parseD(s).toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});
}
function vTx(){
  var tx=S.tx.filter(function(t){return t.date.slice(0,7)===month}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  var h=banner()+monthBar();
  if(!tx.length)return h+'<div class="empty">Belum ada transaksi di bulan ini.<br>Ketuk Catat untuk menambah.</div>';
  var groups={},order=[];
  tx.forEach(function(t){if(!groups[t.date]){groups[t.date]=[];order.push(t.date)}groups[t.date].push(t)});
  order.forEach(function(d){
    h+='<div class="day">'+dayLabel(d)+'</div><div class="list">'+groups[d].map(txRow).join('')+'</div>';
  });
  return h;
}

function duePill(d){
  var s=sisa(d);
  if(s<=0)return '<span class="pill ok">Lunas</span>';
  if(!d.due)return '<span class="pill">Tanpa tenggat</span>';
  var diff=Math.round((parseD(d.due)-parseD(today()))/86400000);
  if(diff<0)return '<span class="pill warn">Terlambat '+(-diff)+' hari</span>';
  if(diff===0)return '<span class="pill warn">Jatuh tempo hari ini</span>';
  if(diff<=7)return '<span class="pill">'+diff+' hari lagi</span>';
  return '<span class="pill">Tempo '+fmtDay(d.due)+'</span>';
}
function vDebt(){
  var list=S.debts.filter(function(d){return d.kind===dk});
  var act=list.filter(function(d){return sisa(d)>0}).sort(function(a,b){return (a.due||'9999')<(b.due||'9999')?-1:1});
  var done=list.filter(function(d){return sisa(d)<=0});
  var tot=sum(act,sisa);
  var h=banner();
  h+='<div class="seg"><button data-act="dk" data-k="piutang" class="'+(dk==='piutang'?'on':'')+'">Piutang</button><button data-act="dk" data-k="hutang" class="'+(dk==='hutang'?'on':'')+'">Hutang</button></div>';
  h+='<div class="debtsum"><div class="eyebrow">'+(dk==='piutang'?'Orang lain berhutang kepada saya':'Saya berhutang kepada orang lain')+'</div><div class="big num '+(dk==='piutang'?'in':'out')+'">'+rp(tot)+'</div></div>';
  function card(d){
    var p=d.amt?Math.min(100,paid(d)/d.amt*100):0;
    return '<button class="dcard" data-act="debt" data-id="'+d.id+'"><div class="h"><b>'+esc(d.who)+'</b><span class="num">'+rp(sisa(d))+'</span></div>'+
      (d.note?'<div class="note">'+esc(d.note)+'</div>':'')+
      '<div class="prog"><i style="width:'+p+'%"></i></div><div class="f"><span>'+rp(paid(d))+' dari '+rp(d.amt)+'</span>'+duePill(d)+'</div></button>';
  }
  if(!act.length&&!done.length)h+='<div class="empty">Belum ada catatan. Ketuk Catat untuk menambah.</div>';
  h+=act.map(card).join('');
  if(done.length)h+='<div class="day">Sudah lunas</div>'+done.map(card).join('');
  return h;
}

function render(){
  var v=tab==='home'?vHome():tab==='tx'?vTx():vDebt();
  $('#app').innerHTML=v;
  var navs=[['home','Ringkasan'],['tx','Transaksi'],['debt','Hutang Piutang']];
  $('#nav').innerHTML=navs.map(function(n){return '<button data-act="tab" data-t="'+n[0]+'" class="'+(tab===n[0]?'on':'')+'">'+IC[n[0]]+'<span>'+n[1]+'</span></button>'}).join('');
  $('#fab').innerHTML=IC.plus+'<span>Catat</span>';
}

}

function closeSheet(){var sh=$('#sheet');sh.hidden=true;sh.innerHTML='';document.body.classList.remove('lock')}
function parseAmt(s){return Number(String(s).replace(/\D/g,''))||0}

  openSheet(
    '<div class="grab"></div><h2>'+(it?'Ubah transaksi':'Transaksi baru')+'</h2>'+

function debtSheet(id){
  var d=S.debts.filter(function(x){return x.id===id})[0];
  if(!d)return;
  var isP=d.kind==='piutang', lbl=isP?'Diterima':'Dibayar';
  var pays=d.pays.slice().sort(function(a,b){return a.date<b.date?1:-1});
  openSheet(
    '<div class="grab"></div><div class="eyebrow">'+(isP?'Piutang':'Hutang')+'</div><h2 style="margin-bottom:4px">'+esc(d.who)+'</h2>'+
    (d.note?'<div class="mut" style="margin-bottom:10px">'+esc(d.note)+'</div>':'')+
    '<div class="num" style="font-size:30px;font-weight:700">'+rp(sisa(d))+'</div>'+
    '<div class="mut" style="font-size:13px">sisa dari '+rp(d.amt)+' · dicatat '+fmtFull(d.date)+'</div>'+
    '<div class="prog"><i style="width:'+(d.amt?Math.min(100,paid(d)/d.amt*100):0)+'%"></i></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px"><span class="mut" style="font-size:13px">'+(d.due?'Jatuh tempo '+fmtFull(d.due):'Tanpa jatuh tempo')+'</span>'+duePill(d)+'</div>'+
    (pays.length?'<label>Riwayat</label>'+pays.map(function(p){return '<div class="pay"><span>'+lbl+' '+fmtFull(p.date)+'</span><b class="num">'+rp(p.amt)+'</b></div>'}).join(''):'')+
    (sisa(d)>0?
      '<label for="f-pay">'+(isP?'Catat uang diterima':'Catat pembayaran')+'</label><div class="amt"><span>Rp</span><input id="f-pay" inputmode="numeric" autocomplete="off" placeholder="0"></div>'+
      '<label for="f-date">Tanggal</label><input id="f-date" type="date">'+
      '<div class="err" id="f-err" hidden></div>'+
      '<div class="actions"><button type="button" class="btn ghost" id="f-full">Tandai lunas</button><button type="button" class="btn" id="f-add">Catat</button></div>':'')+
    '<div class="actions"><button type="button" class="btn danger" id="f-del">Hapus</button><button type="button" class="btn ghost" data-act="close">Tutup</button></div>',
    function(p){
      if(sisa(d)>0){
        $('#f-date',p).value=today();
        $('#f-pay',p).addEventListener('input',function(e){fmtInput(e.target)});
        $('#f-add',p).addEventListener('click',function(){
          var a=parseAmt($('#f-pay',p).value);
          if(!a){showErr('Isi jumlah lebih dari 0.');return}
          if(a>sisa(d)){showErr('Jumlah melebihi sisa '+rp(sisa(d))+'.');return}
          d.pays.push({id:uid(),amt:a,date:$('#f-date',p).value||today()});
          save();render();debtSheet(id);toast('Tercatat');
        });
        $('#f-full',p).addEventListener('click',function(){
          d.pays.push({id:uid(),amt:sisa(d),date:$('#f-date',p).value||today()});
          save();render();debtSheet(id);toast('Lunas');
        });
      }
      armDelete($('#f-del',p),function(){S.debts=S.debts.filter(function(x){return x.id!==id});save();closeSheet();render();toast('Dihapus')});
    }
  );
}

function dataSheet(){
  openSheet(
    '<div class="grab"></div><h2>Data dan cadangan</h2>'+
    '<div class="hint" style="margin-top:0">Data tersimpan di browser ini saja. Salin cadangan secara berkala dan simpan di catatan atau pesan ke diri sendiri.</div>'+
    (canPin?'<label>Keamanan</label><div class="actions" style="margin-top:0">'+(pinInfo()?'<button type="button" class="btn ghost" id="f-lock">Kunci</button><button type="button" class="btn ghost" id="f-chpin">Ubah PIN</button><button type="button" class="btn ghost" id="f-offpin">Matikan</button>':'<button type="button" class="btn ghost" id="f-onpin">Aktifkan PIN</button>')+'</div><div class="hint">PIN mengunci tampilan aplikasi di perangkat ini. Aplikasi terkunci otomatis setelah ditinggalkan lebih dari 1 menit.</div>':'')+
    '<div class="actions"><button type="button" class="btn" id="f-copy">Salin cadangan</button></div>'+
    '<label for="f-json">Pulihkan dari cadangan</label><textarea id="f-json" placeholder="Tempel teks cadangan di sini"></textarea>'+
    '<div class="err" id="f-err" hidden></div>'+
    '<div class="actions"><button type="button" class="btn ghost" id="f-restore">Pulihkan</button><button type="button" class="btn danger" id="f-del">Hapus</button></div>'+
    '<div class="hint">Hapus akan menghapus semua catatan di browser ini.</div>'+
    '<div class="hint">Pasang di layar utama Android: buka halaman ini di Chrome, ketuk menu ⋮, lalu Tambahkan ke layar utama.</div>',
    function(p){
      var bl=$('#f-lock',p);if(bl)bl.addEventListener('click',function(){lockNow()});
      var bo=$('#f-onpin',p);if(bo)bo.addEventListener('click',function(){closeSheet();setupPin(function(){toast('PIN aktif')},false)});
      var bc=$('#f-chpin',p);if(bc)bc.addEventListener('click',function(){closeSheet();verifyThen(function(){setupPin(function(){toast('PIN diganti')},false)})});
      var bf=$('#f-offpin',p);if(bf)bf.addEventListener('click',function(){closeSheet();verifyThen(function(){lsDel(PINKEY);lsSet(SKIPKEY,'1');toast('PIN dimatikan')})});
      $('#f-copy',p).addEventListener('click',function(){
        var txt=JSON.stringify(S),ta=$('#f-json',p);
        function fallback(){ta.value=txt;ta.focus();ta.select();showErr('Salin otomatis tidak tersedia. Teks cadangan sudah dipilih, salin secara manual.')}
        try{navigator.clipboard.writeText(txt).then(function(){toast('Cadangan disalin')},fallback)}catch(e){fallback()}
      });
      $('#f-restore',p).addEventListener('click',function(){
        try{
          var o=JSON.parse($('#f-json',p).value);
          if(!o||!Array.isArray(o.tx)||!Array.isArray(o.debts))throw 0;
          S={tx:o.tx,debts:o.debts};save();closeSheet();render();toast('Data dipulihkan');
        }catch(e){showErr('Teks cadangan tidak valid.')}
      });
      armDelete($('#f-del',p),function(){S={tx:[],debts:[]};save();closeSheet();render();toast('Semua data dihapus')});
    }
  );
}

/* ===== Kunci PIN ===== */
var PINKEY='kantong-pin',SKIPKEY='kantong-pin-skip',FAILKEY='kantong-pin-fail',PINLEN=6;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function pinInfo(){try{return JSON.parse(lsGet(PINKEY))}catch(e){return null}}
var canPin=!!(window.crypto&&window.crypto.subtle&&window.isSecureContext);
function b64(buf){var s='',b=new Uint8Array(buf);for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function unb64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function newSalt(){return b64(window.crypto.getRandomValues(new Uint8Array(16)))}
function hashPin(pin,salt){
  var enc=new TextEncoder();
  return window.crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']).then(function(k){
    return window.crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},k,256);
  }).then(b64);
}
function failState(){try{var f=JSON.parse(lsGet(FAILKEY));if(f&&typeof f.n==='number')return f}catch(e){}return {n:0,until:0}}

var pinBuf='',pinCb=null,pinCancel=null,wipeArmed=false;
function paintDots(){var h='';for(var i=0;i<PINLEN;i++)h+='<i'+(i<pinBuf.length?' class="on"':'')+'></i>';var d=$('#lk-d');if(d)d.innerHTML=h}
function pinMsg(m){var e=$('#lk-m');if(e)e.textContent=m||''}
function pinFail(m){
  pinBuf='';paintDots();pinMsg(m);
  var d=$('#lk-d');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}
}
function pinClose(){
  var el=$('#lock');el.hidden=true;el.innerHTML='';pinCb=null;
  if($('#sheet').hidden)document.body.classList.remove('lock');
}
function pinScreen(o){
  pinBuf='';pinCb=o.onPin;pinCancel=o.onCancel||pinClose;
  var pad='',i;
  for(i=1;i<=9;i++)pad+='<button type="button" data-k="'+i+'">'+i+'</button>';
  pad+='<span></span><button type="button" data-k="0">0</button><button type="button" class="fn" data-k="del" aria-label="Hapus angka terakhir">Hapus</button>';
  var links='';
  if(o.cancel)links+='<button type="button" data-lk="cancel">Batal</button>';
  if(o.skip)links+='<button type="button" data-lk="skip">Lewati dulu</button>';
  if(o.forgot)links+='<button type="button" data-lk="forgot">Lupa PIN?</button>';
  var el=$('#lock');
  el.innerHTML='<div class="lk"><div class="brand">Kantong</div><h2>'+esc(o.title)+'</h2><div class="sub">'+esc(o.sub||'')+'</div><div class="dots" id="lk-d"></div><div class="lk-msg" id="lk-m" role="alert"></div><div class="pad">'+pad+'</div><div class="lk-links">'+links+'</div></div>';
  el.hidden=false;document.body.classList.add('lock');paintDots();
}
function pinPress(k){
  if(!pinCb)return;
  if(k==='del'){pinBuf=pinBuf.slice(0,-1);paintDots();return}
  if(pinBuf.length>=PINLEN)return;
  pinMsg('');pinBuf+=k;paintDots();
  if(pinBuf.length===PINLEN){var cb=pinCb,v=pinBuf;setTimeout(function(){cb(v)},90)}
}

function showUnlock(){
  var info=pinInfo();
  document.body.classList.add('locked');
  pinScreen({title:'Masukkan PIN',sub:'Buka Kantong',forgot:true,onPin:function(pin){
    var f=failState();
    if(f.until>Date.now()){pinFail('Tunggu '+Math.ceil((f.until-Date.now())/1000)+' detik, lalu coba lagi.');return}
    hashPin(pin,info.salt).then(function(h){
      if(h===info.hash){lsDel(FAILKEY);document.body.classList.remove('locked');pinClose();render()}
      else{
        var n=f.n+1;
        if(n>=5){lsSet(FAILKEY,JSON.stringify({n:0,until:Date.now()+30000}));pinFail('Salah 5 kali. Tunggu 30 detik.')}
        else{lsSet(FAILKEY,JSON.stringify({n:n,until:0}));pinFail('PIN salah.')}
      }
    },function(){pinFail('Perangkat tidak bisa memeriksa PIN.')});
  }});
}
function lockNow(){if(!canPin||!pinInfo())return;closeSheet();showUnlock()}
function verifyThen(fn){
  var info=pinInfo();if(!info){fn();return}
  pinScreen({title:'PIN saat ini',sub:'Masukkan PIN untuk melanjutkan',cancel:true,onPin:function(pin){
    hashPin(pin,info.salt).then(function(h){if(h===info.hash){pinClose();fn()}else pinFail('PIN salah.')},function(){pinFail('Perangkat tidak bisa memeriksa PIN.')});
  }});
}
function setupPin(done,first){
  pinScreen({title:'Buat PIN',sub:PINLEN+' angka untuk membuka Kantong',skip:first,cancel:!first,onPin:function(p1){
    pinScreen({title:'Ulangi PIN',sub:'Masukkan PIN yang sama',cancel:true,onCancel:function(){setupPin(done,first)},onPin:function(p2){
      if(p1!==p2){pinFail('PIN tidak sama. Ulangi dari awal.');setTimeout(function(){setupPin(done,first)},1000);return}
      var salt=newSalt();
      hashPin(p1,salt).then(function(h){
        lsSet(PINKEY,JSON.stringify({salt:salt,hash:h}));lsDel(SKIPKEY);lsDel(FAILKEY);pinClose();if(done)done();
      },function(){pinFail('Perangkat tidak bisa membuat PIN.')});
    }});
  }});
}
function forgotScreen(){
  wipeArmed=false;pinCb=null;
  $('#lock').innerHTML='<div class="lk"><div class="brand">Kantong</div><h2>Lupa PIN?</h2><div class="sub" style="margin:10px 0 22px">PIN tidak bisa dipulihkan. Kamu bisa menghapus PIN, tetapi semua catatan di perangkat ini ikut terhapus. Kalau punya teks cadangan, pulihkan setelah itu.</div><div class="actions" style="flex-direction:column"><button type="button" class="btn danger" data-lk="wipe">Hapus PIN dan semua data</button><button type="button" class="btn ghost" data-lk="back">Kembali</button></div></div>';
}
$('#lock').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.k!==undefined){pinPress(b.dataset.k);return}
  var a=b.dataset.lk;
  if(a==='cancel'){pinCancel()}
  else if(a==='skip'){lsSet(SKIPKEY,'1');pinClose()}
  else if(a==='forgot'){forgotScreen()}
  else if(a==='back'){showUnlock()}
  else if(a==='wipe'){
    if(!wipeArmed){wipeArmed=true;b.textContent='Ketuk lagi untuk menghapus';return}
    S={tx:[],debts:[]};save();lsDel(PINKEY);lsDel(FAILKEY);lsSet(SKIPKEY,'1');
    document.body.classList.remove('locked');pinClose();render();toast('PIN dan data dihapus');
  }
});
document.addEventListener('keydown',function(e){
  if($('#lock').hidden||!pinCb)return;
  if(/^[0-9]$/.test(e.key))pinPress(e.key);
  else if(e.key==='Backspace')pinPress('del');
});
var hiddenAt=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return}
  if(hiddenAt&&canPin&&pinInfo()&&!document.body.classList.contains('locked')&&Date.now()-hiddenAt>60000)lockNow();
});

if(canPin&&pinInfo()){showUnlock()}
else{render();if(canPin&&!lsGet(SKIPKEY))setupPin(null,true)}
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
</body>
</html>
